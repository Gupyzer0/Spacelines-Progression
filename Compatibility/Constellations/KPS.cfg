// ----------------------------------------------------------------------------
// KPS (GPS)
// ----------------------------------------------------------------------------

// Prototype navigation satellite system
@CONTRACT_TYPE[KPSPrototype]
{
    REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = MatureNavSat
		minCount = 1
		title = Complete 1 Early Navigation Satellites contract
	}

	REQUIREMENT
	{
		name = CompleteNetworkContract
		type = CompleteContract
		tag = EarlyNavNetwork
		minCount = 1
		title = Complete 1 Early Nav Network contract
	}
}

// Deactivating Mature Navsat and Early Nav Network contracts once the 
// KPSPrototype contract has been completed

@CONTRACT_TYPE[MatureNavSat]
{
	REQUIREMENT
	{
		name = CompleteConstellationsPrototypeKPS
		type = CompleteContract
		contractType = KPSPrototype
		invertRequirement = true
		title = Contract will deactivate once the KPS prototype contract is completed
	}
}

@CONTRACT_TYPE[EarlyNavNetwork3]
{
	REQUIREMENT
	{
		name = CompleteConstellationsPrototypeKPS
		type = CompleteContract
		contractType = KPSPrototype
		invertRequirement = true
		title = Contract will deactivate once the KPS prototype contract is completed
	}
}

