// ----------------------------------------------------------------------------
// RELAYS
// ----------------------------------------------------------------------------

// Establish a LKO relay
@CONTRACT_TYPE[LowTechRelay.0]
{
    REQUIREMENT
	{	
		name = CompleteContractFirstCommSat
		type = CompleteContract
		contractType = FirstComSat
		title = Complete the First Communications Satellite contract
	}
}

// Launch a satellite into Earth's kolynia orbit
@CONTRACT_TYPE[KolyniaConstellation]
{
    REQUIREMENT
	{	
		name = CompleteContractMolniya
		type = CompleteContract
		contractType = FirstMolniyaSat
		title = Complete the First Molniya Orbit Satellite contract
	}
}

// Place a kerbostationary relay above the KSC
@CONTRACT_TYPE[KsoRelay]
{
    REQUIREMENT
	{
		name = SpacelinesCompleteContract1
		type = CompleteContract
		contractType = FirstGEOSat
		title = Complete the First Geosynchronous Satellite contract
	}
}

// Place a kerbostationary relay
@CONTRACT_TYPE[KsoRelayAlt]
{
    REQUIREMENT
	{
		name = CompleteContractFirstGEOSat
		type = CompleteContract
		contractType = FirstGEOSat
		title = Complete the First Geosynchronous Satellite contract
	}
}

// Moon relay
@CONTRACT_TYPE[MoonRelay]
{
	REQUIREMENT
    {
        name = ReachOrbit
        type = Orbit
		targetBody = @/targetBody
		title = Must have orbited the target body.
    }
}
