// ----------------------------------------------------------------------------
// RELAYS
// ----------------------------------------------------------------------------

// Low Tech Relay
@CONTRACT_TYPE[LowTechRelay.0]
{
    REQUIREMENT
	{	
		name = CompleteContract
		type = CompleteContract
		contractType = EarlyComSat
		title = Complete 1 Early Communications Satellite Contract
	}
}

// Deactivating Early Commsat contract if Low Tech Relay is completed
@CONTRACT_TYPE[EarlyComSat]
{
    REQUIREMENT
    {
        name = CompleteContractLowTechRelay0
        type = CompleteContract
        contractType = LowTechRelay.0
        title = Deactivate if the Low Tech Relay contract is completed
    }
}

// GEO
@CONTRACT_TYPE[KsoRelay]
{
    REQUIREMENT
	{
		name = SpacelinesCompleteContract1
		type = CompleteContract
		contractType = FirstGeosync
		title = Complete the First Geosynchronous Satellite contract
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = EarlyComSat
		minCount = 1
		title = Complete 1 Early Communications Satellites contract
	}
}
@CONTRACT_TYPE[KsoRelayAlt]
{
    REQUIREMENT
	{
		name = SpacelinesCompleteContract1
		type = CompleteContract
		contractType = FirstGeosync
		title = Complete the First Geosynchronous Satellite contract
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = EarlyComSat
		minCount = 1
		title = Complete 1 Early Communications Satellites contract
	}
}


// Establish a moon relay
@CONTRACT_TYPE[MoonRelay]
{
    REQUIREMENT
	{
		name = AllMoonOrbiterContracts
		type = All

        REQUIREMENT:NEEDS[JNSQ]
		{
			name = CompleteContractMun
			type = CompleteContract

			contractType = MunOrbiter
            minCount = 1
		}
        REQUIREMENT:NEEDS[JNSQ]
		{
			name = CompleteContractMinmus
			type = CompleteContract

			contractType = MinmusOrbiter
            minCount = 1
		}
        REQUIREMENT:NEEDS[KSRSS]
		{
			name = CompleteContractMoon
			type = CompleteContract

			contractType = MoonOrbiter
            minCount = 1
		}
    }
}

// Establish relay at moon's Lagrange point
@CONTRACT_TYPE[MoonRelayLagrange]
{
    REQUIREMENT
	{
		name = AnyMoonOrbiterContract
		type = Any

        REQUIREMENT:NEEDS[JNSQ]
		{
			name = CompleteContractMun
			type = CompleteContract

			contractType = MunOrbiter
            minCount = 1
		}
        REQUIREMENT:NEEDS[JNSQ]
		{
			name = CompleteContractMinmus
			type = CompleteContract

			contractType = MinmusOrbiter
            minCount = 1
		}
        REQUIREMENT:NEEDS[KSRSS]
		{
			name = CompleteContractMoon
			type = CompleteContract

			contractType = MoonOrbiter
            minCount = 1
		}
    }
}
