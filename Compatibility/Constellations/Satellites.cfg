// Launch a satellite into low @/targetBody orbit
@CONTRACT_TYPE[LKOSatellite]
{
    REQUIREMENT
	{
		type = All
        name = AllObservationContracts
		
		title = Complete all of the Observation Contracts
        
        REQUIREMENT
        {	
            name = CompleteContract1
            type = CompleteContract
            contractType = EOSCherenkov
        }
        REQUIREMENT
        {	
            name = CompleteContract2
            type = CompleteContract
            contractType = EOSCorona
        }
        REQUIREMENT
        {	
            name = CompleteContract3
            type = CompleteContract
            contractType = EOSCosmicRay1
        }
        REQUIREMENT
        {	
            name = CompleteContract4
            type = CompleteContract
            contractType = EOSIonizationElectrostatic
        }
        REQUIREMENT
        {	
            name = CompleteContract5
            type = CompleteContract
            contractType = EOSMagScan1
        }
        REQUIREMENT
        {	
            name = CompleteContract6
            type = CompleteContract
            contractType = EOSWeather1
        }
        REQUIREMENT
        {	
            name = CompleteContract7
            type = CompleteContract
            contractType = EOSWeather2
        }
    }
}

// Launch an infrared telescope into "+@/targetBody+"'s orbit
@CONTRACT_TYPE[KerbinSentinel]
{
    @title = Launch a telescope into orbit.

    !REQUIREMENT[TechResearched] {}

    // Tech Requirements
    REQUIREMENT 
    {
        type = Any
        name = ResearchedAnyTelescope

        // Squad
        REQUIREMENT
        {
            name = TechResearched1
            type = TechResearched

            part = InfraredTelescope
        }

        // BDB
        REQUIREMENT:NEEDS[Bluedog_DB]
        {
            name = TechResearched2
            type = TechResearched

            part = bluedog_OAO_WEP_instrument
        }

        REQUIREMENT:NEEDS[Bluedog_DB]
        {
            name = TechResearched3
            type = TechResearched

            part = bluedog_OAO3_PEP_instrument
        }

        REQUIREMENT:NEEDS[Bluedog_DB]
        {
            name = TechResearched4
            type = TechResearched

            part = bluedog_OAO_SAO_instrument
        }
    }

    // Part validation
    @PARAMETER[Satellite]
    {
        !PARAMETER[PartValidation] {}
		
        PARAMETER
        {
            type = Any
            name = AnyTelescopePart

            // Squad
            PARAMETER
            {
                name = PartValidation1
                type = PartValidation

                part = InfraredTelescope
            }

            // BDB
            PARAMETER:NEEDS[Bluedog_DB]
            {
                name = PartValidation2
                type = PartValidation

                part = bluedog_OAO_WEP_instrument
            }

            PARAMETER:NEEDS[Bluedog_DB]
            {
                name = PartValidation3
                type = PartValidation

                part = bluedog_OAO3_PEP_instrument
            }

            PARAMETER:NEEDS[Bluedog_DB]
            {
                name = PartValidation4
                type = PartValidation

                part = bluedog_OAO_SAO_instrument
            }
        }
    }
}

