CONTRACT_TYPE
{
	name = FirstGEOSat
	title = First Geostationary Satellite
	group = CommercialApplications
	
	description = <b>Program: Advanced Commercial Applications</b><br><br>A geostationary orbit is a circular orbit 8,968 km above the our planet's equator and following the direction of the our planet's rotation. An object in such an orbit has an orbital period equal to our planet's rotational period (12 hours) and thus will appear motionless at a fixed position in the sky to ground observers. &br;&br;Launch a satellite into a Geostationary Orbit.

	synopsis = Launch a satellite into a Geostationary Orbit

	completedMessage = Success! The Geostationary orbit is the most commonly used orbit for communications satellites and other observation satellites.

	sortKey = 503

	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 60
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	// Requirements for Commercial Applications 2
	REQUIREMENT
	{
		name = CompleteCommercialApplications1
		type = All

		REQUIREMENT
		{	
			name = CompleteFirstMolniya
			type = CompleteContract
			contractType = FirstMolniyaSat
			title = Complete the first Molniya Satellite contract
		}

        REQUIREMENT
		{
			name = CompleteNetwork
			type = Any
			title = Complete any of the network creation contracts
			{
				REQUIREMENT
				{	
					name = CompleteContractNavNetwork
					type = CompleteContract
					tag = EarlyNavNetwork
				}
				REQUIREMENT
				{	
					name = CompleteContractCommNetwork
					type = CompleteContract
					tag = EarlyCommNetwork
				}
			}
		}
    }

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = FirstGeosync
		invertRequirement = true
	}
	
	PARAMETER
	{
		name = GeostationarySat
		type = VesselParameterGroup
		title = Geostationary satellite
		define = Geostationary
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew 
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
		}
		PARAMETER
        {
            name = HasAntenna
            type = HasAntenna

            antennaType = RELAY
			minAntennaPower = 2250000 // Syncom's antenna power
        }
		PARAMETER
		{
			name = ReachSpecificOrbit
			type = ReachSpecificOrbit
			displayNotes = true
			index = 0
			title = Achieve geostationary orbit
			deviationWindow = 0.01
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
	
	BEHAVIOUR
	{
		name = GeostationaryOrbit
		type = OrbitGenerator
		RANDOM_ORBIT
		{
			type = STATIONARY
		}
	}
}