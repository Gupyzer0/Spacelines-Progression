CONTRACT_TYPE
{
	name = FirstGeosync
	title = Geosynchronous Test Satellite
	group = CommercialApplications
	agent = fai

	description = <b>Program: Advanced Commercial Applications</b><br><br>With an orbital period of an earth day, a satellite will remain above a constant longitude, appearing to drift north and south through the day. This will allow for constant connection to a ground station.<br>Historical example: Syncom 2 (39kg, Thor-Delta) launched in July of 1963.<b>

	synopsis = Launch a geosynchronous test satellite

	completedMessage = Congratulations! The satellite is in orbit and connected to the groundstation.

	sortKey = 409

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 60
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

    // Requirements for Commercial Applications 2
	REQUIREMENT
	{
		name = CompleteCommercialApplications1
		type = All

		REQUIREMENT
		{	
			name = CompleteFirstMolniya
			type = CompleteContract
			contractType = FirstMolniyaSat
			title = Complete the first Molniya Satellite contract
		}

        REQUIREMENT
		{
			name = CompleteNetwork
			type = Any
			title = Complete any of the network creation contracts
			{
				REQUIREMENT
				{	
					name = CompleteContractNavNetwork
					type = CompleteContract
					tag = EarlyNavNetwork
				}
				REQUIREMENT
				{	
					name = CompleteContractCommNetwork
					type = CompleteContract
					tag = EarlyCommNetwork
				}
			}
		}      
    }

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = FirstGEOSat
		invertRequirement = true
	}

	// Not needed anymore if a GEO orbit is attained
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstGEOSat
		invertRequirement = true
	}

	PARAMETER
	{
		name = FirstGeosync
		type = VesselParameterGroup
		title = First Geosynchronous Satellite
		define = FirstGeosync
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew 
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
		}
        PARAMETER
        {
            name = HasAntenna
            type = HasAntenna

            antennaType = RELAY
			minAntennaPower = 2250000 // Syncom's antenna power
        }

		PARAMETER
		{
			name = ReachSpecificOrbit
			type = ReachSpecificOrbit
			displayNotes = true
			index = 1
			title = Achieve the required orbit
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}

    BEHAVIOUR
	{
		name = OrbitGenerator
		type = OrbitGenerator
	
		RANDOM_ORBIT
		{
			targetBody = HomeWorld()
			type = SYNCHRONOUS
			inclinationFactor = 0.3
			deviationWindow = 1
		}
	}
}