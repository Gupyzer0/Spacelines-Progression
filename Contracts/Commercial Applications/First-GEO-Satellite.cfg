CONTRACT_TYPE
{
	name = FirstGEOSat
	title = First Geostationary Satellite
	group = CommercialApplications
	
	description = A geostationary orbit is a circular orbit above @/targetBody 's equator and following the direction of the our @/targetBody 's rotation at such altitude that the orbit has an orbital period equal @/targetBody 's rotational period (12 hours) and thus will appear motionless at a fixed position in the sky to ground observers.<br><br><b>Historical example: Syncom 3 (39kg, Delta-D) launched in August of 1964.<b>
	genericDescription = Launch a satellite into a Geostationary Orbit
	synopsis = Launch a satellite into a Geostationary Orbit

	completedMessage = Success! The Geostationary orbit is the most commonly used orbit for communications satellites and other observation satellites.

	sortKey = 503

	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 60
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
	{	
		name = CompleteFirstCommsat
		type = CompleteContract
		contractType = FirstComSat
		title = Complete the first Communications Satellite contract
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = FirstGeosync
		invertRequirement = true
	}
	
	PARAMETER
	{
		name = GeostationarySat
		type = VesselParameterGroup
		title = Geostationary satellite
		define = Geostationary
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew 
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
		}
		PARAMETER
        {
            name = HasAntenna
            type = HasAntenna

            antennaType = RELAY
			minAntennaPower = 2250000 // Syncom's antenna power
        }
		PARAMETER
		{
			name = ReachSpecificOrbit
			type = ReachSpecificOrbit
			displayNotes = true
			index = 0
			title = Achieve geostationary orbit
			deviationWindow = 0.01
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
	
	BEHAVIOUR
	{
		name = GeostationaryOrbit
		type = OrbitGenerator
		RANDOM_ORBIT
		{
			type = STATIONARY
		}
	}
}