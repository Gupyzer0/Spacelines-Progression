CONTRACT_TYPE
{
	name = FirstGeosync
	title = Geosynchronous Test Satellite
	group = CommercialApplications

	description = With an orbital period of an @/targetBody day, a satellite will remain above a constant longitude, appearing to drift north and south through the day. This will allow for constant connection to a ground station.<br><br><b>Historical example: Syncom 2 (39kg, Delta-B) launched in July of 1963.<b>
	genericDescription = Launch a satellite into a Geosynchronous Orbit
	synopsis = Launch a geosynchronous test satellite

	completedMessage = Congratulations! The satellite is in orbit and connected to the groundstation.

	sortKey = 409

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 60
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
	{	
		name = CompleteFirstCommsat
		type = CompleteContract
		contractType = FirstComSat
		title = Complete the first Communications Satellite contract
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		contractType = FirstGEOSat
		invertRequirement = true
	}

	// Not needed anymore if a GEO orbit is attained
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = FirstGEOSat
		invertRequirement = true
	}

	PARAMETER
	{
		name = FirstGeosync
		type = VesselParameterGroup
		title = First Geosynchronous Satellite
		define = FirstGeosync
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew 
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
		}
		PARAMETER
		{
			name = GenerateEC
			title = Have positive energy balance
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			maxEccentricity = 0.05
			minPeriod = 11h 57m
			maxPeriod = 12h 02m
			disableOnStateChange = false
			title = Achieve a Geosynchronous orbit with low eccentricity

			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}