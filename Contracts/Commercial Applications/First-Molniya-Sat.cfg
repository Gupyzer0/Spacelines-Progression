CONTRACT_TYPE
{
	name = FirstMolniyaSat
	title = First Molniya Orbit Satellite
	group = CommercialApplications

	description = A Molniya orbit is a highly elliptical, high-inclination orbit primarily used for communication and remote sensing over high-latitude regions, particularly the northern hemisphere. It's characterized by its 63.4-degree inclination and a period of approximately 6 hours, allowing satellites to spend extended periods over a specific area and allow communications satellites to operate at hight latitudes.<br><br><b>Historical example: Molniya-1 (1.600 kg, Molniya (8K78)) launched in April of 1965.<b>
	genericDescription = Launch a satellite into a Molniya Orbit
	synopsis = Launch a satellite into a Molniya Orbit

	completedMessage = Success! The Molniya orbit is highly eccentric and allows the satellite to spend most of its time over the high latitudes.

	sortKey = 501

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 60
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	
	REQUIREMENT
	{	
		name = CompleteFirstCommsat
		type = CompleteContract
		contractType = FirstComSat
		title = Complete the First Communications Satellite contract
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Molniya satellite
		define = MolniyaSatellite

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
        {
            name = HasAntenna
            type = HasAntenna

            antennaType = RELAY
			minAntennaPower = 1
        }
		PARAMETER
		{
			name = GenerateEC
			title = Have positive energy balance
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
			hideChildren = true
		}
		PARAMETER
        {
            name = ReachSpecificOrbit
            type = ReachSpecificOrbit
            displayNotes = true
            index = 0
            title = Achieve a Molniya orbit
            deviationWindow = 0.5
            
            PARAMETER
            {
                name = Duration
                type = Duration

                duration = 2m

                preWaitText = Check for stable orbit
                waitingText = Checking for stable orbit
                completionText = Stable orbit: Confirmed
            }
        }
	}	

    BEHAVIOUR
	{
		name = MolniyaOrbit
		type = OrbitGenerator
		RANDOM_ORBIT
		{
			type = KOLNIYA
		}
	}
}