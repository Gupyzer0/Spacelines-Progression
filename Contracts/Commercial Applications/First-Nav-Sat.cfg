CONTRACT_TYPE
{
	name = FirstNavSat
	title = First Navigational Satellite
	group = CommercialApplications

	description = Through measuring the Doppler shift of radio signals transmitted from a satellite in a known orbit, it is possible for a receiver on the ground to establish their location, which would have many applications both civilian and military. To test the principle and develop receiver equipment, it is necessary to have a test navigational satellite in orbit. Be sure to include solar panels to generate power.<br><br><b>Historical example: Transit 1B (119 kg, Thor-Ablestar).</b>
	genericDescription = Launch the first navigation satellite
	synopsis = Launch the first navigation satellite

	completedMessage = Congratulations! The satellite is in orbit and we have already begun to receive Doppler curves.

	sortKey = 410

	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 365

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 45
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
	{	
		name = CompleteFirstCommsat
		type = CompleteContract
		contractType = FirstComSat
		title = Complete the first Communications Satellite contract
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------

	PARAMETER
	{
		name = FirstNavSat
		type = VesselParameterGroup
		title = First Navigational Satellite
		define = FirstNavSat

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
        PARAMETER
		{
			name = GenerateEC
			title = Have positive energy balance
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minInclination = 60
			maxInclination = 70
			minAltitude = @targetBody.AtmosphereAltitude()
			maxEccentricity = 0.26
			disableOnStateChange = true

			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 45s

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}