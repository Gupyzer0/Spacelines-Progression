CONTRACT_TYPE
{
	name = FirstTundraSat
	title = First Tundra Orbit Satellite	
	group = CommercialApplications

	description = A Tundra orbit is a highly elliptical geosynchronous orbit (note: not geostationary orbit) with a high inclination (usually near 63.4) and an orbital period of one sidereal day. A satellite placed in this orbit spends most of its time over a chosen area of @/targetBody, a phenomenon known as apogee dwell. The ground track of a satellite in a tundra orbit is a closed figure eight.<br><br><b>Historical example: Sirius 1 (3800kg, Proton-K/DM3) launched in June of 2000.</b>
	genericDescription = Launch a satellite into a Tundra Orbit
	synopsis = Launch a satellite into a Tundra Orbit

	completedMessage = Success! The Tundra orbit is highly eccentric and let's the satellite spend most of its time over the high latitudes.	

	sortKey = 502

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()	

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks4000 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 60
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
	{	
		name = CompleteFirstMolniya
		type = CompleteContract
		contractType = FirstMolniyaSat
		title = Complete the First Molniya Satellite contract
	}

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Tundra satellite
		define = TundraSatellite

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
        PARAMETER
        {
            name = HasAntenna
            type = HasAntenna

            antennaType = RELAY
			minAntennaPower = 1
        }
		PARAMETER
		{
			name = GenerateEC
			title = Have positive energy balance
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
			hideChildren = true
		}
		PARAMETER
        {
            name = ReachSpecificOrbit
            type = ReachSpecificOrbit
            displayNotes = true
            index = 0
            title = Achieve a Tundra orbit
            deviationWindow = 0.5
            
            PARAMETER
            {
                name = Duration
                type = Duration

                duration = 2m

                preWaitText = Check for stable orbit
                waitingText = Checking for stable orbit
                completionText = Stable orbit: Confirmed
            }
        }
	}

    BEHAVIOUR
	{
		name = TundraOrbit
		type = OrbitGenerator
		RANDOM_ORBIT
		{
			type = TUNDRA
		}
	}
}