CONTRACT_TYPE
{
	name = first_Docking
	title = First Docking
	group = CrewedOrbit
	tag = CrewedOrbitRequired

	description = Perform the first docking between two spacecraft.<br><br><b>Gemini 8 (3.788 kg, Titan II GLV) launched in March of 1966.</b>
	genericDescription = Perform the first docking of two vessels in orbit.
	synopsis = Perform the first docking of two vessels in orbit.
	completedMessage = Nice Work! We have achieved hard lock!

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 365

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.6
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.4
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 150
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = Rendezvous
		title = Complete the Rendezvous contract
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = CrewedOrbitOptional
		invertRequirement = true
		title = Don't have an active optional crewed orbit contract.
	}

	// Vessel Name
	DATA
	{
		type = string
		craft = dockingSpacecraft
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Dock to another spacecraft while in orbit.
		define = @/craft

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew 
			minCrew = 1
			maxCrew = 3
			title = Have at least 1 crewmember but no more than 3
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			title = Orbit @targetBody
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Docking
			type = Docking
			title = Dock two spacecraft in orbit
			hideChildren = true
			completeInSequence = true
		}
	}

	// Return Home Safely
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Return Home Safely
		vessel = @/craft

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
		}
		completeInSequence = true
	}

	// Checking crew safety
	PARAMETER
	{
		name = All
		type = All
		title = safely

		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your vessel

			vessel = @/craft
		}

		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone

			vessel = @/craft
		}
		completeInSequence = true
		disableOnStateChange = true
	}
}