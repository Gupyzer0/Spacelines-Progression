CONTRACT_TYPE
{
	name = first_EVA
	title = First EVA
	group = CrewedOrbit
	tag = CrewedOrbitRequired

	description = Performing the first EVA provides valuable insight into future spacesuit, rather than flight suit, design. It also highlights future technologies that need development for EVA. Launch a spacecraft into orbit with least one crewmember aboard, perform a spacewalk while recording observations, and immediately transmit them home. Then, return the crew to @/targetBody after at least one full orbit with a perigee above 85 km.<br><br><b>Historical example: Voskhod 2 (5.682 kg, Voskhod 11A57) launched in March of 1965.</b>

	synopsis = Perform a spacewalk during an orbital mission (with report), then return safe.

	completedMessage = A spacewalk, and then a safe return. Excellent work!

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 365

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.6
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.4
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 150
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = first_OrbitCrewed
    }

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = CrewedOrbitOptional
		invertRequirement = true
		title = Don't have an active optional crewed orbit contract.
	}

	// Vessel Name
	DATA
	{
		type = string
		craft = CrewEVA
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = CrewEVA
		type = VesselParameterGroup
		title = First orbital EVA
		define = @/craft
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew 
			minCrew = 1
			maxCrew = 3
			title = Have at least 1 crewmember but no more than 3
		}
		PARAMETER
		{
			name = EVAReportInOrbit
			type = All
			title = Reach orbit, Perform an EVA, and get the data of the EVA back to KSC
			hideChildren = true
			PARAMETER
			{
				name = OrbitEarth
				type = Orbit
				minPeA = @targetBody.AtmosphereAltitude()
				targetBody = HomeWorld()
			}
			PARAMETER
			{
				name = EVAReport
				type = CollectScience
				targetBody = HomeWorld()
				situation = InSpaceLow
				experiment = evaReport
				recoveryMethod = RecoverOrTransmit
			}
			disableOnStateChange = true // when you go inside
		}
	}

	// Return Home Safely
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Return Home Safely
		vessel = @/craft

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
		}
		completeInSequence = true
	}

	// Checking crew safety
	PARAMETER
	{
		name = All
		type = All
		title = safely

		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your vessel

			vessel = @/craft
		}

		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone

			vessel = @/craft
		}
		completeInSequence = true
		disableOnStateChange = true
	}
}