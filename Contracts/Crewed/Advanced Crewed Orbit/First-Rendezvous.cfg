CONTRACT_TYPE
{
	name = Rendezvous
	title = First Rendezvous
	group = CrewedOrbit
	tag = CrewedOrbitRequired

	description =  Using your own knowledge of orbital mechanics, bring two craft to within 100 meters of each other while in orbit around @/targetBody. At least one of the spacecraft must be a new launch.<br><br><b>Historical Example: The first successful rendezvous between two spacecraft was when Gemini 6 and 7 met in 1965. Wally Schirra maneuvered Gemini 6 to within 30 cm of Gemini 7, close enough and precise enough to prove that docking two craft together in space was possible.</b>
	genericDescription = Perform the First Rendezvous of two craft in space.
	synopsis = Perform the First Rendezvous of two craft in space.
	
	completedMessage = Congratulations! By accomplishing the first rendezvous, it opens up the possibilities of what we can do while in orbit.

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 365

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.6
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.4
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 150
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

    REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = CollectCrewedScienceBasic
		title = Put the Rendezvous Target Vehicle In Orbit
    }

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = CrewedOrbitOptional
		invertRequirement = true
		title = Don't have an active optional crewed orbit contract.
	}

	// Vessel Name
	DATA
	{
		type = string
		craft = RendezvousVessel
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = Rendezvous
		type = VesselParameterGroup
		title = First rendezvous
		define = @/craft

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = HasCrew
			type = HasCrew 
			minCrew = 1
			maxCrew = 3
			title = Have at least 1 crewmember but no more than 3
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minAltitude = @targetBody.AtmosphereAltitude()
			title = Orbit @targetBody
			disableOnStateChange = true
			hideChildren = true
		}
		PARAMETER
		{
			name = Rendezvous
			type = Rendezvous

			title = Rendezvous with the target vehicle
			distance = 5
			disableOnStateChange = true
		}
	}

	// Return Home Safely
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Return Home Safely
		vessel = @/craft

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
		}
		completeInSequence = true
	}

	// Checking crew safety
	PARAMETER
	{
		name = All
		type = All
		title = safely

		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your vessel

			vessel = @/craft
		}

		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone

			vessel = @/craft
		}
		completeInSequence = true
		disableOnStateChange = true
	}
}