CONTRACT_TYPE
{
	name = OrbitalTestFlightAnimal
	title = Orbital Test Flight (Animal Crew)
	group = CrewedOrbit
    tag = CrewedOrbitOptional

	description = <b>Program: Crewed Orbit<br></b><br><br>Before putting a crew in a capsule to send into space, it is a good idea to test the capsule with an advanced biological creature in it. Send a Crew Capsule WITH AN ANIMAL (one of the generated tourists) into orbit and return safely home. These animals are represented by tourists.<br><br>Can be completed @maxCompletions times.
	
	genericDescription = Launch a crew-capable spacecraft, WITH AN ANIMAL (one of the generated tourists), into orbit and return safely home. The animals will be represented in-game as tourists.

	synopsis = Send an animal on a test flight of a crewed vessel on an orbital flight

	completedMessage = Congratulations! The capsule has proven to work and the animal has returned safely.

	sortKey = 602

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 2
	maxSimultaneous = 1
	deadline = 365

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:EarlyCrewedRewardMultiplier * 0.6
	rewardFunds = @rewardReputation * @SpacelinesContracts:EarlyCrewedRewardMultiplier * 0.4
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 75
	failureReputation = @rewardReputation * 0.5

	// ************ REQUIREMENTS ************
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = OrbitalTestFlight
		title = Completed Orbital Test Flight (Uncrewed) Contract
	}

	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = first_OrbitCrewed
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = CrewedOrbitOptional
		invertRequirement = true
		title = Don't have another active optional crewed orbit contract.
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = CrewedOrbitRequired
		invertRequirement = true
		title = Don't have an active required crewed orbit contract.
	}

    // Vessel Name
	DATA
	{
		type = string
		craft = orbitalTestFlightAnimal
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------		
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbital test flight
        define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = OneCrewCapacity
			type = HasCrewCapacity
			minCapacity = 1
			title = Have space for at least 1 crewmember on board
			hideChildren = true
			disableOnStateChange = false
		}
		
		PARAMETER
		{
			name = NoCrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed vessel
			hideChildren = true
		}
		
		PARAMETER
		{
			name = HasPassengers
			type = HasPassengers
			count = 1
			title = Animal on board (use generated tourist)
			hideChildren = true
		}

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			targetBody = HomeWorld()
			disableOnStateChange = true

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 45m
				preWaitText = Stay in specified orbit for the duration
				waitingText = Completing orbit...
				completionText = Orbit completed, you may fire retros when ready.
			}
		}

		PARAMETER
		{
			name = HasPower
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1.0
			title = Craft must have Electric Charge
			hideChildren = true
		}
	}

    // Return Home Safely
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Return Home Safely
		vessel = @/craft

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
		}
		completeInSequence = true
	}

	// Checking crew safety
	PARAMETER
	{
		name = All
		type = All
		title = safely

		PARAMETER
		{
			name = VesselNotDestroyed
			type = VesselNotDestroyed
			title = without destroying your vessel

			vessel = @/craft
		}

		PARAMETER
		{
			name = KerbalDeaths
			type = KerbalDeaths
			title = or killing anyone

			vessel = @/craft
		}
		completeInSequence = true
		disableOnStateChange = true
	}
	
	BEHAVIOUR
	{
		name = SpawnPassengers
		type = SpawnPassengers
		title = Spawn the Animal Passenger
		kerbal = Test Animal
	}
}