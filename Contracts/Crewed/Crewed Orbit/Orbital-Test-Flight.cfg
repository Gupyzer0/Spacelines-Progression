CONTRACT_TYPE
{
	name = OrbitalTestFlight
	title = Orbital Test Flight (Uncrewed)
	group = CrewedOrbit
	tag = CrewedOrbitRequired

	description = Before putting a crew in a capsule to send into space, it is a good idea to test the capsule on an uncrewed flight. Send a Crew Capsule, WITH NO CREW IN IT, into orbit and return safely to @/targetBody.
	genericDescription = Launch a crew-capable spacecraft, WITH NO CREW IN IT, into orbit and return safely home.
	synopsis = Send an uncrewed test flight of a crewed vessel on an orbital flight

	completedMessage = Congratulations! The capsule has proven to work!

	sortKey = 602

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 365

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.6
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.4
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 60
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = first_OrbitRecover
		title = Completed Reach Orbital Speed & Return Safely Contract
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = CrewedOrbitOptional
		invertRequirement = true
		title = Don't have another active optional crewed orbit contract.
	}

	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = CrewedOrbitRequired
		invertRequirement = true
		title = Don't have an active required crewed orbit contract.
	}

	REQUIREMENT // No active sounding rocket contracts 
	{
		name = AcceptContract
		type = AcceptContract
		tag = SoundingRocket
		invertRequirement = true
	}

	// Vessel Name
	DATA
	{
		type = string
		craft = orbitalTestFlight
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------	
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbital test flight
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = OneCrewCapacity
			type = HasCrewCapacity
			minCapacity = 1
			title = Have space for at least 1 crewmember on board
			hideChildren = true
		}

		PARAMETER
		{
			name = NoCrew
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = Orbit
			type = Orbit
			minPeA = @targetBody.AtmosphereAltitude()
			targetBody = HomeWorld()
			disableOnStateChange = true

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 45m
				preWaitText = Stay in specified orbit for the duration
				waitingText = Completing orbit...
				completionText = Orbit completed, you may fire retros when ready.
			}
		}

		PARAMETER
		{
			name = HasPower
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1.0
			title = Craft must have Electric Charge
			hideChildren = true
		}
	}

	// Return Home Safely
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Return Home Safely
		vessel = @/craft

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
		}
		completeInSequence = true
	}
}