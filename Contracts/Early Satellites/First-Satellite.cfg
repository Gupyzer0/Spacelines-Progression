CONTRACT_TYPE
{
	name = FirstSatellite // Sputnik 1 | Explorer 1
	title = First Artificial Satellite
	group = EarlySatellites
	
	description = We need you to give @/targetBody its first artificial satellite! Design, build, and launch a craft that will successfully place an object in orbit with a perigee of at least 80 km.<br><br>You can accept other orbit contracts at the same time as this if want to do multiple things on your first orbital launch (for example, you could combine all four starting orbit contracts and launch a solar-powered polar science satellite.<br><br><b>Historical example: Sputnik 1 (83Kg, Sputnik 8K71PS) launched in October 1957.</b>
	genericDescription = Launch the first satellite into orbit.
	synopsis = Launch the first satellite into orbit.

	completedMessage = Congratulations on placing the first artificial satellite in orbit!

	sortKey = 401

	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 75
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract
        contractType = KarmanLine
        minCount = 1
        cooldownDuration = 0d
    }

	REQUIREMENT // No active sounding rocket contracts 
	{
		name = AcceptContract
		type = AcceptContract
		tag = SoundingRocket
		invertRequirement = true
	}
	
	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = FirstSat
		type = VesselParameterGroup
		title = First satellite
		define = FirstSat
		
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Orbit
			type = Orbit
			minAltitude = @targetBody.AtmosphereAltitude()
			disableOnStateChange = true
			title = Achieve stable orbit around @targetBody
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 45s

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}