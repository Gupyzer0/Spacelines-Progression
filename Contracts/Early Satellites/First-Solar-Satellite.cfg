CONTRACT_TYPE
{
	name = FirstSolarSat //Vanguard 1
	title = First Solar-Powered Satellite
	group = EarlySatellites
	
	description = While batteries alone are good enough for simple satellites, they are insufficient for the greater energy demands of more complex systems. The first step towards that is to generate power to augment the supplied batteries. Launch a satellite into the specified orbit and demonstrate that it can generate more solar power than it consumes after a 2-week period in orbit.<br><br><color="green">Make sure your craft has solar panels and can generate enough electricity.</color><br><br><b>Historical example Vanguard 1 (1.46 Kg, Vanguard TV-4).</b>
	genericDescription = Launch a solar-powered satellite
	synopsis = Launch a solar-powered satellite

	completedMessage = Success! This is an important step in increasing the usefulness of our satellites in orbit.

	sortKey = 404

	cancellable = false
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()


	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 50
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	
	REQUIREMENT
	{
		name = AnyFirstSatellite
		type = Any

		REQUIREMENT
		{
			name = AcceptContract
			type = AcceptContract
			contractType = FirstSatellite
		}

		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = FirstSatellite
			minCount = 1
			cooldownDuration = 0d
		}
	}

	REQUIREMENT // No active sounding rocket contracts 
	{
		name = AcceptContract
		type = AcceptContract
		tag = SoundingRocket
		invertRequirement = true
	}
	
	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = SolarSat
		type = VesselParameterGroup
		title = Solar satellite
		define = SolarSatellite

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = HasSolarPower
			title = Can generate solar power
			type = PartValidation
			hideChildren = true
			partModule = ModuleDeployableSolarPanel
			minCount = 1
		}
		PARAMETER
		{
			name = GenerateEC
			title = Have positive energy balance
			type = ResourceConsumption
			resource = ElectricCharge
			minRate = -1000000
			maxRate = 0.00001
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitWrapper
			title = Stay in specified orbit for 14 days
			type = All
			completeInSequence = true

			PARAMETER
			{
				name = Orbit
				type = Orbit

				targetBody = HomeWorld()
				minAltitude = @targetBody.AtmosphereAltitude()
				title = Reach a stable orbit
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 14d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}

			PARAMETER
			{
				name = HasEC
				type = HasResource
				resource = ElectricCharge
				minQuantity = 5
			}
		}
	}
}