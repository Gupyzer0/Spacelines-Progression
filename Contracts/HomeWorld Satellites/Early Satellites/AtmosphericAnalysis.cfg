CONTRACT_TYPE
{
	name = AtmosphericAnalysis
	title = Atmospheric Analysis Satellite
	group = ScienceSatellites
	
	description = <b>Program: Early Satellites<br></b><br><br>It would be great for all humans if we could find a way to better predict the weather. One of the first steps in this is to understand the properties of the upper atmosphere. Launch a satellite with a Barometer and Thermometer on it to study the upper atmosphere. Transmit the science back to the KSC for analysis. If you have already completed the temperature and pressure scan, click info -> forced run in order to complete this contract. &br;&br;This could be considered the first "Weather Satellite" and will open up new weather satellite opportunities.

	synopsis = Launch a Satellite to study the upper atmosphere

	completedMessage = Congratulations! The information returned from the satellite has allowed our scientists to make some more accurate predictions of the weather. Our next step is to get a camera into orbit.

	sortKey = 406

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = 0
	rewardFunds = @rewardReputation * @SpacelinesContracts:KerbucksReputationRewardMultiplier
	failureFunds = @rewardFunds
	rewardScience = 5
	rewardReputation = 4
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
    REQUIREMENT	
	{	
		name = CompleteContract
		type = CompleteContract
		title = Complete the first scientific satellite contract

		contractType = FirstScienceSatellite
	}

	REQUIREMENT // No active sounding rocket contracts 
	{
		name = AcceptContract
		type = AcceptContract
		tag = SoundingRocket
		invertRequirement = true
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = EOS_AtmosphericDensity
		type = VesselParameterGroup
		title = Atmospheric Satellite
		define = EOS_AtmosphericDensity

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = PartValidationKerbalism
			type = PartValidation
			title = Carry a Barometer Experiment

			VALIDATE
			{
				MODULE
				{
					name = Experiment
					experimentID = barometerScan
				}
			}
		}

		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for 1 day and transmit science

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 1.0
				title = Craft must have Electric Charge for 1 day
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				maxApA = @targetBody.SpaceAltitudeThreshold()
			    minPeA = @targetBody.AtmosphereAltitude()
				disableOnStateChange = true
				title = Orbit requirements
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Collecting science...
				completionText = Science collected. 
			}
		}
	}
}
