CONTRACT_TYPE
{
	name = first_OrbitRecover
	title = Reach Orbital Speed & Return Safely
	group = EarlySatellites
	agent = fai

	description = <b>Program: Early Satellites<br></b><br><br>Reentry is brutally hot and dangerous, but it can be survivable with the right technology and equipment. We want you to design, build, and launch a craft that can survive a reentry and make a soft landing or splashdown. Note that orbital-speed suborbital flights are acceptable as well. Historically this research started with weapon reentry vehicles for the newly developing ICBM forces but the research, and rockets, were quite applicable elsewhere; reconnaissance satellite recovery vessels, crewed capsules, and interplanetary landers have also withstood this crucible.
	genericDescription = Recover a craft from an orbital-velocity descent. Your vessel must reach a surface velocity of at least 3800 m/s. 

	synopsis = Recover an uncrewed vessel from an orbital-velocity descent

	completedMessage = Congratulations! The craft has survived reentry, and engineers are examining it very keenly indeed.

	sortKey = 104

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = 0
	rewardFunds = @rewardReputation * @SpacelinesContracts:KerbucksReputationRewardMultiplier
	failureFunds = @advanceFunds
	rewardScience = 1
	rewardReputation = 3
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
        name = CompleteContract
        type = CompleteContract
        contractType = FirstSatellite
        minCount = 1
        maxCount = 1
        cooldownDuration = 0d
	}

	REQUIREMENT // No active sounding rocket contracts 
	{
		name = AcceptContract
		type = AcceptContract
		tag = SoundingRocket
		invertRequirement = true
	}

	// Vessel Name
	DATA
	{
		type = string
		craft = orbitRecovery
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = OrbitReturn
		type = VesselParameterGroup
		title = Recover a craft from orbit
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = HasNoCrew
			type = HasCrew
			maxCrew = 0
			minCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = OrbitalVelocity
			type = ReachState
			minSpeed = 3800
			speedMode = Surface
			minAltitude = 85000
			situation = SUB_ORBITAL
			title = Reach surface velocity of 3800 m/s with a minimum altitude of 85 km
			disableOnStateChange = true
		}
		PARAMETER
		{
			name = HasPower
			type = HasResource
			resource = ElectricCharge
			minQuantity = 1.0
			title = Craft must have Electric Charge
			hideChildren = true
		}
	}

	// Return Home Safely
	PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Return Home Safely
		vessel = @/craft

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
		}
		completeInSequence = true
	}
}