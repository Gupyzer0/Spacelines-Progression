CONTRACT_TYPE:NEEDS[JNSQ]
{
	name = landingEdna
	title = Edna Landing (Uncrewed)
	group = SmallBodiesExploration

	description = Send a craft to land on Edna and return science data back to Earth.
	genericDescription = Achieve a soft landing on Edna and transmit science.

	synopsis = Achieve a soft landing on Edna and transmit science

	completedMessage = Mission Success! You have safely landed on Edna and returned valuable science data from the surface.  

	sortKey = 713

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 1825

	targetBody = Edna

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.2
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.8
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 150
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
		name = AtLeast
		type = AtLeast

		count = 2

		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyDres
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyEdna
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyMoho
		}
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Edna lander

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = LandOnEdna
			type = ReachState
			targetBody = Edna
			situation = LANDED
			disableOnStateChange = true
			title = Land on Edna
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectSpaceScience
			type = CollectScience
			title = Transmit science data from @targetBody

			recoveryMethod = Transmit
			hideChildren = true
			completeInSequence = true
		}
	}
}