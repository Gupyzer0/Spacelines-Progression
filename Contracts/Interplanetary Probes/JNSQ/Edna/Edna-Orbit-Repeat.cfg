CONTRACT_TYPE:NEEDS[JNSQ]
{
	name = orbitEdna_Rep
	title = Edna Orbital Science Probe
	group = SmallBodiesExploration

	description = Design and successfully launch an uncrewed probe that will enter into a scientifically useful orbit of Edna.

	synopsis = Send an uncrewed probe into orbit around Edna

	completedMessage = Congratulations! We can continue to gather data from the new satellite.

	sortKey = 1108

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 0
	maxSimultaneous = 1
	deadline = 1825

	targetBody = Edna

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.2
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.8
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 50
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = orbitEdna
	}

	DATA
	{
		type = double
		orbitKM = Round((@targetBody.Radius() * 5) / 1000)
		title = Get Maximum Orbit Height
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbit Edna
		define = OrbitEdna

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			maxApA = @targetBody.Radius() * 5
			disableOnStateChange = true
			title = Orbit Edna with a maximum apoapsis of @/orbitKM km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}