CONTRACT_TYPE:NEEDS[JNSQ]
{
	name = probeEve
	title = Eve Atmospheric Probe
	group = EveSurfaceExploration
	
	description = Design and successfully launch an uncrewed probe that will enter into the atmosphere of Eve and return scientific data.
	synopsis = Send an uncrewed probe into the Eve's atmosphere and transmit science
	completedMessage = Congratulations! Our scientists have learned valuable information about the make-up of the atmosphere.

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 1460

	targetBody = Eve

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.4
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.6
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 250
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
    {
        name = All
        type = All
    
        REQUIREMENT
        {
            name = CompleteContract
            type = CompleteContract

            contractType = flybyEve
        }

		REQUIREMENT
        {
            name = CompleteContract
            type = CompleteContract

            contractType = orbitEve
        }
    }

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Atmospheric probe Eve
		define = ProbeEve
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterAtmo
			type = ReachState
			situation = FLYING
			disableOnStateChange = true
			maxAltitude = @/targetBody.AtmosphereAltitude()
			title = Enter Eve's atmosphere
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectScienceA
			type = CollectScience
			experiment = barometerScan
			targetBody = @/targetBody
			situation = FlyingHigh
			recoveryMethod = Transmit
			title = Transmit barometric data science while flying high above Eve's Atmosphere
		}
	}
}