CONTRACT_TYPE:NEEDS[JNSQ]
{
	name = flybyMoho
	title = Moho Flyby
	group = SmallBodiesFlyby

	description = <b>Program: Small Bodies Flyby</b><br><br>Create a probe and send it to flyby Moho within 10,000 km. Make sure to transmit science from the flyby.

	synopsis = Flyby Moho closer than 10,000 km and transmit science

	completedMessage = Congratulations on the flyby! The data is coming in now.

	sortKey = 802

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 1460

	targetBody = Moho

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.2
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.8
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 350
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
		name = AnyInnerPlanetOrbit
		type = Any

		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = orbitEve
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = orbitDuna
		}
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Flyby Moho
		define = FlybyMoho
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = FlybyPlanet
			type = ReachState
			maxAltitude = 10000000
			disableOnStateChange = true
			title = Flyby Moho within 10,000 km
			hideChildren = true
		}
		PARAMETER
		{
			name = CollectSpaceScience
			type = CollectScience
			recoveryMethod = Transmit
			title = Transmit science data from space near @targetBody
			hideChildren = true
			completeInSequence = true
		}
	}
}