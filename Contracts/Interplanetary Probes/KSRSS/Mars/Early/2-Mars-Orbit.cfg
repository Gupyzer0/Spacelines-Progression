CONTRACT_TYPE:NEEDS[KSRSS]
{
	name = orbitMars
	title = Mars Orbit
	group = EarlyInnerPlanetsProbes
	

	description = Design and successfully launch an uncrewed probe that will enter into an orbit of Mars.

	synopsis = Send an uncrewed probe into orbit around Mars

	completedMessage = Congratulations! We can continue to gather data from the new satellite.

	sortKey = 1000

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 1460

	targetBody = Mars

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 250
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract

		contractType = flybyMars
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbit Mars
		define = OrbitMars

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			minAltitude = @/targetBody.AtmosphereAltitude()
			disableOnStateChange = true
			title = Orbit Mars 
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}