CONTRACT_TYPE:NEEDS[KSRSS]
{
	name = probeMars
	title = Mars Atmospheric Probe
	group = MarsSurfaceExploration
		
	description = Design and successfully launch an uncrewed probe that will enter into the atmosphere of Mars and return scientific data.
	synopsis = Send an uncrewed probe into the Mars's atmosphere and transmit science
	completedMessage = Congratulations! Our scientists have learned valuable information about the make-up of the atmosphere.

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 1460

	targetBody = Mars

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.4
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.6
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 250
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
    {
        name = All
        type = All
    
        REQUIREMENT
        {
            name = CompleteContract
            type = CompleteContract

            contractType = flybyMars
        }

		REQUIREMENT
        {
            name = CompleteContract
            type = CompleteContract

            contractType = orbitMars
        }
    }

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Atmospheric probe Mars
		define = ProbeMars
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterAtmo
			type = ReachState
			situation = FLYING
			disableOnStateChange = true
			maxAltitude = 50000
			title = Enter Mar's atmosphere
			hideChildren = true
		}
		PARAMETER
		{
			name = AtmoScience
			type = CollectScience
			recoveryMethod = Transmit
			title = Transmit science data from Mar's atmosphere, AFTER going below 50 km
			hideChildren = true
			completeInSequence = true
		}
	}
}