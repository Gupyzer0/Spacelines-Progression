CONTRACT_TYPE:NEEDS[KSRSS]
{
	name = samplesPhobos
	title = Phobos Sample Return
	group = MarsSurfaceExploration
	
	description = <b>Program: Mars Surface Exploration<br></b><br><br>Design and successfully launch an uncrewed probe to land on Phobos, gather science, and bring something back for study. This is a sample return missions so you cannot just transmit the data back, it needs to be physically returned.
	synopsis = Send an uncrewed craft to land on Phobos and return the science to Earth.
	completedMessage = Congratulations! Our scientists can learn a lot more about the make-up of the planet by studying the physical samples that you have returned.

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 1460

	targetBody = Phobos

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.4
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.6
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 1000
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
    {
        name = CompleteContract
        type = CompleteContract

        contractType = landingPhobos
    }

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------

	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Phobos sample return
		define = SamplePhobos

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = Landing
			type = ReachState
			situation = LANDED
			situation = SPLASHED
			disableOnStateChange = true
			title = Safely land on Phobos
			hideChildren = true
		}
		PARAMETER
        {
            name = ReturnHome
            type = ReturnHome
            title = Recover the spaceship and samples intact
        }
	}
	PARAMETER
	{
		name = SurfaceScience
		type = CollectScience
		situation = SrfLanded
		situation = SrfSplashed
		recoveryMethod = Recover
		title = Gather science while landed and <b><color=white>Return it home, DO NOT TRANSMIT</color></b>
		hideChildren = true
	}
}