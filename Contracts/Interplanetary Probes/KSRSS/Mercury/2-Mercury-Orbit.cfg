CONTRACT_TYPE:NEEDS[KSRSS]
{
	name = orbitMercury
	title = Mercury Orbit
	group = MercuryExploration

	description = Design and successfully launch an uncrewed probe that will enter into an orbit of Mercury.

	synopsis = Send an uncrewed probe into orbit around Mercury

	completedMessage = Congratulations! We can continue to gather data from the new satellite.

	sortKey = 1002

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 1825

	targetBody = Mercury

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.2
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.8
	failureFunds = @advanceFunds
	rewardScience = 5
	rewardReputation = 400
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT // No Active Flyby Contract
	{
		name = AcceptContract
		type = AcceptContract
		
		contractType = flybyMercury
		invertRequirement = true
	}

	REQUIREMENT
	{
		name = AtLeast
		type = AtLeast

		count = 2

		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyVesta
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyCeres
		}
		REQUIREMENT
		{
			name = CompleteContract
			type = CompleteContract
			contractType = flybyMercury
		}
	}

	DATA
	{
		type = double
		orbitKM = Round((@targetBody.Radius() * 2) / 1000)
		title = Get Minimum Orbit Height
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = VesselGroup
		type = VesselParameterGroup
		title = Orbit Mercury
		define = OrbitMercury
	
		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = EnterOrbit
			type = Orbit
			situation = ORBITING
			maxPeA = @targetBody.Radius() * 2
			disableOnStateChange = true
			title = Orbit Mercury with a maximum periapsis of @/orbitKM km
			
			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2m

				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}