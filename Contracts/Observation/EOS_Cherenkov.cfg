CONTRACT_TYPE:NEEDS[Spacelines-Kerbalism]
{
	name = EOSCherenkov	
	title = Earth observation: Cherenkov Detection Beyond LEO
	group = ScienceSatellites
	
	description = Launch a satellite into an elliptical orbit with a new cosmic ray detector called a Cherenkov counter. This device is a different type of cosmic ray detector specifically calibrated for high-energy particles like neutrinos.<br><br>Historical example: Explorer 11 (37kg, Juno II)

	synopsis = Launch a scientific satellite into an elliptical orbit with Cherenkov Counter experiment.

	completedMessage = Congratulations! The satellite you sent into orbit has returned interesting results about the high-energy particle environment around Earth.

	sortKey = 402

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 40
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT	
	{	
		name = CompleteContract
		type = CompleteContract
		contractType = EOSCosmicRay1
		
		title = Completed first cosmic ray satellite
	}

	REQUIREMENT
	{
		name = TechResearched
		type = TechResearched
		title = Requires the "The Scientific Method" science node researched
		tech = science2
	}
	
	REQUIREMENT // No active sounding rocket contracts 
	{
		name = AcceptContract
		type = AcceptContract
		tag = SoundingRocket
		invertRequirement = true
	}
	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = ScienceSatCherenkov
		type = VesselParameterGroup
		title = Cherenkov detector
		define = ScienceSatCherenkov

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
        {
            name = PartValidation
            type = PartValidation
			title = Have a Cherenkov Detector experiment (Spacelines Cosmic Ray 3)

            VALIDATE
            {
                MODULE
                {
                    name = Experiment
                    experimentID = Spacelines_CosmicRay3
                }
            }
        }

		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for at least 1 day and transmit science

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 1.0
				title = Craft must have Electric Charge for 1 day
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				title = Orbit requirements
				minPeA = 100000
				maxPeA = 500000
				disableOnStateChange = true
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 1d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}
	}
}
