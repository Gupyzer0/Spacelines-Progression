CONTRACT_TYPE
{
	name = EOSCoronaRep	
	title = Improved Earth Imaging Satellite
	group = Surveillance
	
	description = <b>Program: Early Earth Observation Satellites<br></b><br><br>With orbital imagery now a proven capability, send up a follow-on early-generation imagery satellite for a longer duration in orbit. This will allow the collection of far more data with repeat passes over the same points on the surface. <b><color="yellow">Make sure your craft contains an Improved Film Camera, and a system to return the film canister for processing. Collection of all available science will require multiple launches due to film storage limitations onboard the vehicle.</color></b><br><br><b>Number of Contracts Completed: @index / @maxCompletions</b><br><br>Historical example: CORONA/Keyhole-4 (1,500kg, Thor-Agena)

	synopsis = Launch dedicated imagery satellites for longer missions.

	completedMessage = Longterm imagery satellites are now a proven technology.

	sortKey = 403

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 8
	maxSimultaneous = 1
	deadline = 180

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 15
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	
	REQUIREMENT	
	{	
        name = CompleteContract
		type = CompleteContract
		contractType = EOSCorona
		title = Completed Dedicated Earth Imaging Satellite
	}

	DATA
	{
		type = int
		index = $RepeatCoronaSats_Count
	}

	BEHAVIOUR
	{
		name = IncrementTheCount
		type = Expression
		
		CONTRACT_COMPLETED_SUCCESS
		{
			RepeatCoronaSats_Count = $RepeatCoronaSats_Count + 1
		}
	}

    // Vessel Name
	DATA
	{
		type = string
		craft = Corona2
	}
	
	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = Corona2
		type = VesselParameterGroup
		title = Higher resolution imagery satellite
		define = @/craft

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		
		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Remain in orbit to gather imagery

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 1.0
				title = Carry Electric Charge for 2 days
				hideChildren = true
			}
			
			PARAMETER
			{
				name = PartValidation
				type = PartValidation
				
				VALIDATE
				{
					MODULE
					{
						name = Experiment
						experimentID = Spacelines_Photos2
					}
				}
				title = Carry an Improved Film Camera
			}			
			PARAMETER
			{
				name = Orbit
				type = Orbit
				title = Orbit requirements
				maxApA = 445000
				maxEccentricity = 0.035 
				minInclination = 70
				maxInclination = 100
				disableOnStateChange = true
			}

			PARAMETER
			{
				name = Duration
				type = Duration

				duration = 2d  //reflects KH-4 mission length

				preWaitText = Achieve desired orbit
				waitingText = Commencing collection
				completionText = Imagery collection complete
			}
		}		
	}

    PARAMETER
	{
		name = VesselParameterGroup
		type = VesselParameterGroup
		title = Recover the film canister
		vessel = @/craft

		PARAMETER
		{
			name = ReachState
			type = ReachState

			targetBody = HomeWorld()
			situation = LANDED
			situation = SPLASHED

			disableOnStateChange = false
		}
		completeInSequence = true
		disableOnStateChange = false
	}
}