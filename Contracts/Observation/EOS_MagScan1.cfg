CONTRACT_TYPE
{
	name = EOSMagScan1	
	title = Magnetometry Satellite
	group = ScienceSatellites
	
	description = Anyone that has ever used a compass is familiar with the magnetic fields that encapsulates our world. Launch a satellite to better charaterize the strength and direction of the magnetic field, and determine how far into space its influence is felt.<br><br><b><color="green">Make sure your craft contains a Magnetic Scan experiment.  Launch it into an elliptical orbit.</color></b><br><br>Historical example: IMP-A (138kg, Thor-Delta)

	synopsis = Launch the first dedicated magnetometry satellite.

	completedMessage = Our scientists now better understand the magnetosphere surrounding us and, combined with previous data, have determined the existance of a standing shock wave in the solar wind around the magnetic field.

	sortKey = 402

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 40
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT	
	{	name = CompleteContract
		type = CompleteContract
		contractType = EOSCosmicRay1
		title = Completed first cosmic ray satellite
	}

	REQUIREMENT
	{
		name = TechResearched
		type = TechResearched
		title = Requires the "Calculus" science node researched
		tech = science3
	}

	PARAMETER
	{
		name = ScienceSatMagScan1
		type = VesselParameterGroup
		title = First magnetrometry satellite
		define = ScienceSatMagScan1

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for 45 days and transmit science

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 1.0
				title = Craft must have Electric Charge for 14 days
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				minPeA = 1500000
				maxApA = 125000000
				minEccentricity = 0.75 //actual orbit was .89
				disableOnStateChange = true
				title = Orbit requirements
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 45d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}
		}

		PARAMETER
		{
			name = PartValidationMagnetometer
			type = PartValidation
			title = Carry a Magnetometer

			VALIDATE
			{
				MODULE
				{
					name = Experiment
					experimentID = magnetometer
				}
			}
		}
	}	
}