CONTRACT_TYPE
{
	name = EOSWeather1
	title = Weather Observing Satellite
	group = ScienceSatellites
	
	description = Weather forecasting today would be impossible without the numerous weather satellites constantly observing our atmosphere from orbit. Launch the very first dedicated weather satellite see the atmosphere and correlate those with real-time video.<br><br><b><color="green">Make sure your craft contains a Visible Imaging 1 experiment.</color></b><br><br>Historical example: TIROS-1 (120kg, Thor-Able)

	synopsis = Launch the first weather satellite with the Infrared Radiometry experiment and an Early TV camera.

	completedMessage = Success! The images provided from this satellite have proven that weather satellites can be extremely effective in helping meteorologists predict the weather.

	sortKey = 401

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 40
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

    REQUIREMENT	
	{	
		name = CompleteContract
		type = CompleteContract
		title = Complete the first scientific satellite contract
		contractType = FirstScienceSatellite
	}

	REQUIREMENT
	{
		name = TechResearched
		type = TechResearched
		title = Requires the "Calculus" science node researched
		tech = science3
	}

    // ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------

	PARAMETER
	{
		name = ScienceEOSWeather1
		type = VesselParameterGroup
		title = First weather satellite
		define = EOSWeather1

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for 7 days and transmit science

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 1.0
				title = Craft must have Electric Charge for 7 days
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				maxApA = 500000
				minPeA = 200000
				maxEccentricity = 0.005
				disableOnStateChange = true
				title = Orbit requirements
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 7d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}

            PARAMETER
            {
                name = PartValidationIRad
                type = PartValidation
                title = Carry a visible imaging experiment

                VALIDATE
                {
                    MODULE
                    {
                        name = Experiment
                        experimentID = Spacelines_VisibleImaging1
                    }
                }
            }
		}
	}
}