CONTRACT_TYPE
{
	name = EOSWeather2
	title = Weather Observing Satellite
	group = ScienceSatellites
	
	description = After the success of your first weather satellite, your government wants additional satellites available for more timely weather observations with better coverage of our world. Launch an additional weather satellite to fulfill their request.<br><br><b><color="green">Make sure your craft contains an Infrared Radiometry experiment and an Visible Imaging 1 experiment. Science requirements can be met over multiple launches.</color></b><br><br>Historical examples: TIROS-2 through TIROS-8.

	synopsis = Launch the first weather satellite with the Infrared Radiometry experiment and an Early TV camera.

	completedMessage = Success! The images provided from this satellite have proven that weather satellites can be extremely effective in helping meteorologists predict the weather.

	sortKey = 401

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 3
	maxSimultaneous = 1
	deadline = 0

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Trivial
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.7
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1500 * 0.3
	failureFunds = @advanceFunds
	rewardScience = 0
	rewardReputation = 40
	failureReputation = @rewardReputation * 0.5

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

    REQUIREMENT	
	{	
		name = CompleteContract
		type = CompleteContract
		title = Complete the first EOS weather satellite contract
		contractType = EOSWeather1
	}

	REQUIREMENT
	{
		name = TechResearched
		type = TechResearched
		title = Requires the "Precision Measurement" science node researched
		tech = science4
	}

    // ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------

	PARAMETER
	{
		name = ScienceEOSWeather2
		type = VesselParameterGroup
		title = First weather satellite
		define = EOSWeather2

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER 
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = OrbitSequence
			type = Sequence
			title = Survive in orbit for 14 days and transmit science

			PARAMETER
			{
				name = HasPower
				type = HasResource
				resource = ElectricCharge
				minQuantity = 1.0
				title = Craft must have Electric Charge for 7 days
				hideChildren = true
			}

			PARAMETER
			{
				name = Orbit
				type = Orbit
				maxApA = 500000
				minPeA = 200000
				maxEccentricity = 0.005
				disableOnStateChange = true
				title = Orbit requirements
			}

			PARAMETER
			{
				name = Duration
				type = Duration
				duration = 30d
				preWaitText = Check for stable orbit
				waitingText = Checking for stable orbit
				completionText = Stable orbit: Confirmed
			}

            PARAMETER
            {
                name = PartValidationTV
                type = PartValidation
                title = Carry a visible imaging experiment

                VALIDATE
                {
                    MODULE
                    {
                        name = Experiment
                        experimentID = Spacelines_VisibleImaging1
                    }
                }
            }

			PARAMETER
            {
                name = PartValidationIRad
                type = PartValidation
                title = Carry an Infrared Radiometry experiment

                VALIDATE
                {
                    MODULE
                    {
                        name = Experiment
                        experimentID = Spacelines_IRRadiometer
                    }
                }
            }
		}
	}
}