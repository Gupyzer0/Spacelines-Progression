CONTRACT_TYPE
{
	name = SuborbitalReturn
	title = Reach a Suborbital Trajectory & Return (uncrewed)
	group = SuborbRocketResearch
	tag = SoundingRocket
	
	description = As early as 1947 the U.S. was launching fruit flies into space on suborbital trajectories and recovering them, but it wasn't until 1951 that a monkey named Yorick and eleven mice were successfully recovered from an Aerobee flight. The Soviets preferred dogs and returned many from suborbital flights, the first two being Dezik and Tsygan in 1951 on top of an R-1. Although it is not a requirement to launch a biological capsule for this mission, it is a perfect opportunity to do so. Send a rocket out of the atmosphere and return at least some of the craft back to Earth, intact, for study.
	synopsis = Return a suborbital spacecraft safely to Earth
	completedMessage = Well Done! Our scientists are now studying the sample to see the reactions from the journey.

	sortKey = 102

	cancellable = true
	declinable = false
	autoAccept = false
	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 360

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant //Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1000 * 0.7
	failureFunds = @rewardFunds
	rewardScience = 5
	rewardReputation = 10
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = KarmanLine
	}

	// Vessel Name
	DATA
	{
		type = string
		craft = Sounding_SuborbitalReturn
	}
	
	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
		name = OrbitReturn
		type = VesselParameterGroup
		title = Suborbital return
		define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}
		PARAMETER
		{
			name = HasNoCrew
			type = HasCrew
			maxCrew = 0
			minCrew = 0
			title = Uncrewed
			hideChildren = true
		}
		PARAMETER
		{
			name = ReachSpace
			type = ReachState
			disableOnStateChange = True
			situation = SUB_ORBITAL
			minAltitude = @/targetBody.AtmosphereAltitude()
			title = Reach space
		}

		PARAMETER
        {
            name = HasPower
            type = HasResource
            resource = ElectricCharge
            minQuantity = 1.0
            title = Craft must have Electric Charge
            hideChildren = true
        }

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
			completeInSequence = true
		}
	}
}