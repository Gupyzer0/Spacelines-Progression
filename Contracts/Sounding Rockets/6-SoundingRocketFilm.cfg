CONTRACT_TYPE
{
	name = SoundingRocketFilm
	group = SuborbRocketResearch
	tag = tag = SoundingRocket
	
	title = First Low Space Film Return
	genericTitle = First Low Space Film Return
	description = V-2s launched by the U.S. from the White Sands Proving Grounds returned the first images of Eart from space. We need you to test emerging high-altitude photography technology. Design, build, and launch a rocket with a payload of bulky testing and stabilization equipment that will recover film imagery from just above the edge of space.<b>After this contract has been completed, 'Low Space Film Return' contract will become available.</b></color>
	genericDescription = Launch a film camera downrange at low altitude and recover it.
	completedMessage = Excellent! Both the media and our scientists will be excited to see these lovely shots.
	synopsis = Launch a rocket with an early film camera above @/altitudeKm km, then return the film camera.

	sortKey = 111

	minExpiry = 0
	maxExpiry = 0
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 0
	cancellable = true
	declinable = false
	autoAccept = false
	
	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant //Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1000 * 0.7
	failureFunds = @rewardFunds
	rewardScience = 5
	rewardReputation = 35
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------

	REQUIREMENT
	{
		name = CompleteKarman
		type = CompleteContract
		contractType = KarmanLine
	}
	
	REQUIREMENT
	{
		name = AcceptContract
		type = AcceptContract
		tag = exclude_SoundingRocket
		invertRequirement = true
	}
		
	DATA
	{
		type = float
		altitudeKm = 60
	}

	PARAMETER
	{
		name = MissionParameters
		type = VesselParameterGroup
		title = Reach @/altitudeKm km of altitude with a film camera, then recover that sample

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
			title = Uncrewed
			hideChildren = true
		}

		PARAMETER
		{
			name = PartValidation
			type = PartValidation
			
			VALIDATE
			{
				MODULE
				{
					name = Experiment
					experimentID = Spacelines_Photos0
				}
			}
			title = Carry a Basic Film Camera
		}

		PARAMETER
		{
			name = SpaceAltitude
			type = ReachState
			minAltitude = @/altitudeKm * 1000
			disableOnStateChange = true
			title = Reach an altitude of at least @/altitudeKm km
		}

		PARAMETER
        {
            name = HasPower
            type = HasResource
            resource = ElectricCharge
            minQuantity = 1.0
            title = Craft must have Electric Charge
            hideChildren = true
        }

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
			completeInSequence = true
		}
	}
}