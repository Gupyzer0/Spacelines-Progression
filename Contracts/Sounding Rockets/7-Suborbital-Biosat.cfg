CONTRACT_TYPE
{
	name = BiosatTest
	group = SuborbRocketResearch
	title = Sub-Orbital Biosatellite Test
	tag = SoundingRocket

	description = A biosatellite is an artificial satellite designed to carry plants or animals in outer space. They are used to research the effects of space (cosmic radiation, weightlessness, etc.) on biological matter

	synopsis = Launch a Biosatellite in a suborbital trajectory and recover the specimen intact
	completedMessage = Mission Success!

	cancellable = true
	declinable = true
	autoAccept = false
	minExpiry = 5
	maxExpiry = 10
	maxCompletions = 1
	maxSimultaneous = 1
	deadline = 360

	targetBody = HomeWorld()

	// ------------------------------------------------------------------------
	// Rewards
	// ------------------------------------------------------------------------
	prestige = Significant //Exceptional
	advanceFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1000 * 0.3
	rewardFunds = @rewardReputation * @SpacelinesContracts:Kerbucks1000 * 0.7
	failureFunds = @rewardFunds
	rewardScience = 5
	rewardReputation = 15
	failureReputation = @rewardReputation

	// ------------------------------------------------------------------------
	// Requirements
	// ------------------------------------------------------------------------
	REQUIREMENT
	{
		name = CompleteContract
		type = CompleteContract
		contractType = SuborbitalReturn
	}

	// Vessel Name
	DATA
	{
		type = string
		craft = Sounding_SuborbitalBiosat
	}

	// ------------------------------------------------------------------------
	// Parameters
	// ------------------------------------------------------------------------
	PARAMETER
	{
        name = SubOrbitalBiosat
        type = VesselParameterGroup
        title = Launch a sub-orbital biosatellite into space in a sub-orbital trajectory and recover it
        define = @/craft
		dissassociateVesselsOnContractCompletion = true

		PARAMETER
		{
			name = NewVessel
			type = NewVessel
			title = Launch a new vessel
			hideChildren = true
		}

		PARAMETER
		{
			name = Crewmembers
			type = HasCrew
			minCrew = 0
			maxCrew = 0
		}

		// Required Parts ---------------------------------
		PARAMETER
		{
			name = BioExp
			type = Any
			title = Carry a (Biological Experiment | Mystery Goo) sample

			PARAMETER
			{
				name = ExperimentSpacelinesKerbalism
				type = PartValidation

				VALIDATE
				{
					MODULE
					{
						name = Experiment
						experimentID = Spacelines_Bioexp1
					}
				}
			}
			PARAMETER
			{
				name = ExperimentSpacelinesKerbalism
				type = PartValidation

				VALIDATE
				{
					MODULE
					{
						name = Experiment
						experimentID = Spacelines_Bioexp2
					}
				}
			}
			PARAMETER
			{
				name = ExperimentKerbalism
				type = PartValidation

				VALIDATE
				{
					MODULE
					{
						name = Experiment
						experimentID = mysteryGoo
					}
				}
			}
		}       
		// /Required Parts ---------------------------------

		PARAMETER
		{
			name = ReachState   
			type = ReachState 
			situation = SUB_ORBITAL
			minAltitude = @/targetBody.AtmosphereAltitude()
			disableOnStateChange = True
		}

		PARAMETER
        {
            name = HasPower
            type = HasResource
            resource = ElectricCharge
            minQuantity = 1.0
            title = Craft must have Electric Charge
            hideChildren = true
        }

		PARAMETER
		{
			name = ReturnHome
			type = ReturnHome
			title = Return home
			completeInSequence = true
		}
	}
} 